[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#FF7BC2"
blue = "#cba6f7"
sidebar_bg = "#181825"
panel_bg = "#11111B"
surface0 = "#1e1e2e"
surface_dim = "#313244"
overlay1 = "#6c7086"

[ui]
sidebar_width = 31
sidebar_max_width = 31
pane_scrollbars = true
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", { token = "workspace", fg = "#cdd6f4", bold = true, dim = false }], ["branch", "git_status"]]

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", { token = "tab", fg = "#cdd6f4", bold = true, dim = false }], [{ token = "state_text", dim = false }, { token = "agent", fg = "#6c7086", dim = false }]]
