[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#FF7BC2"
blue = "#cba6f7"
sidebar_bg = "#181825"
panel_bg = "#11111B"
surface0 = "#1e1e2e"
surface_dim = "#313244"
overlay1 = "#6c7086"

# Herdr Electric paints pane content itself, so panes look the same in any terminal:
# Electric's Ghostty background and text, and Ghostty's built-in Catppuccin Mocha palette.
[theme.terminal]
background = "#11111b"
foreground = "#cdd6f4"
palette = ["#45475a", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#a6adc8",
           "#585b70", "#f37799", "#89d88b", "#ebd391", "#74a8fc", "#f2aede", "#6bd7ca", "#bac2de"]

[ui]
sidebar_width = 31
sidebar_max_width = 31
pane_scrollbars = true
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", { token = "workspace", fg = "#cdd6f4", bold = true, dim = false }], ["branch", "git_status"]]

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", { token = "tab", fg = "#cdd6f4", bold = true, dim = false }], [{ token = "state_text", dim = false, rules = [{ equals = "idle", fg = "#6c7086" }] }, { token = "agent", fg = "#6c7086", dim = false }]]
