# Herdr Electrified Electric: Ghostty appearance. Managed by herdr-electrified; undo removes it.
theme = "Catppuccin Mocha"
background = #11111b
cursor-style = block
cursor-style-blink = true
cursor-opacity = 1
cursor-color = #cdd6f4
minimum-contrast = 1
font-family = "JetBrainsMono Nerd Font Mono"
font-size = 12.5
font-thicken = false
adjust-icon-height = 25%
adjust-cell-height = 5%
bold-is-bright = true
window-padding-x = 8
window-padding-y = 6
window-padding-balance = true
window-padding-color = extend
background-opacity = 1
background-blur = 0
macos-titlebar-style = transparent
window-theme = auto
unfocused-split-opacity = 0.85
