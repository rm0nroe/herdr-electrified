id = "herdr-electrified"
name = "Herdr Electrified"
version = "1.0.0"
min_herdr_version = "0.8.2"
description = "Preview, check, and undo your installed appearance settings"
platforms = ["macos"]

[[build]]
command = ["uv", "sync", "--frozen", "--no-dev", "--no-editable", "--project", "..", "--python", "3.12"]

[[actions]]
id = "preview"
title = "Preview Herdr Electrified"
contexts = ["workspace", "pane"]
command = ["../.venv/bin/python", "-m", "herdr_electrified.cli", "preview-apply"]

[[actions]]
id = "check"
title = "Check Herdr Electrified"
contexts = ["workspace", "pane"]
command = ["../.venv/bin/python", "-m", "herdr_electrified.cli", "check"]

[[actions]]
id = "undo"
title = "Undo Herdr Electrified"
contexts = ["workspace", "pane"]
command = ["../.venv/bin/python", "-m", "herdr_electrified.cli", "undo"]
